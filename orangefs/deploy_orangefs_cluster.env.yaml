# Example Heat environment file for deploy_orangefs_cluster.yaml
# Fill in values before deployment.

parameters:
    
  compute_node_count: 1
  storage_node_count: 1

  key_name: default
  # reservation_id is auto-injected by deploy_orangefs_cluster_stack.sh

  # OpenStack API credentials (from CHI-241337-openrc.sh)
  os_auth_type: v3applicationcredential
  os_auth_url: https://chi.tacc.chameleoncloud.org:5000/v3
  os_identity_api_version: "3"
  os_region_name: "CHI@TACC"
  os_interface: public
  
  
  # Optional overrides
  node_image: DC_ORANGEFS_03-03-2026
  node_flavor: baremetal
  node_network: sharednet1
  repo_url: https://github.com/hariharan-devarajan/chameleoncloud.git
  repo_ref: dev
  openstack_timeout_seconds: 1800
  mount_ssh_timeout_seconds: 1800
